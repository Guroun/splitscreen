
plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}" apply false
}

allprojects {
    apply plugin: 'java'
    tasks.withType(JavaCompile).configureEach {
        it.options.release = "${project.java_version}" as int
        options.encoding = "UTF-8"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of("${project.java_version}")
        }
    }
}
