plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${project.archives_base_name}-fabric-${project.mod_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(":common")
}

processResources {
    // Substitute the mod version into fabric.mod.json
    inputs.property "mod_version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "java_version", project.java_version
    inputs.property "fabric_loader_version", project.fabric_loader_version
    filesMatching("fabric.mod.json") {
        expand "mod_version": project.mod_version,
               "minecraft_version": project.minecraft_version,
               "java_version": project.java_version,
               "fabric_loader_version": project.fabric_loader_version
    }
}

project.afterEvaluate {
    sourceSets.named('main').configure { sourceSet ->
        sourceSet.java.srcDir(project(":common").file("src/main/java"))
        sourceSet.resources.srcDir(project(":common").file("src/main/resources"))
    }
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

jar {
    // copy LICENSE from the repo root and rename it to avoid conflicts with other mods
    from("LICENSE") {
        rename { "${it}_${archivesName}"}
    }
}
